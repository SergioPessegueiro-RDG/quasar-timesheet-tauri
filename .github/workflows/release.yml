name: Release

# Produces the Mac and Windows downloads. Run it manually to get installable
# artifacts without publishing, or push a v* tag to create a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal-apple-darwin is Tauri's own pseudo-target: it builds both
          # real Apple triples and lipos them together, so rustup needs each of
          # them individually and would reject the pseudo-target by name.
          - os: macos-latest
            tauri-target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-latest
            tauri-target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Add Rust targets
        run: rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.tauri-target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.tauri-target }}
          # Only set on a tag push, which is what makes this publish a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: QUASAR Timesheet Manager ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # Without a tag the action above publishes nothing and leaves the build on
      # the runner, so a manual run needs this to get anything downloadable.
      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tauri-target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.tauri-target }}/release/bundle/**
            src-tauri/target/${{ matrix.tauri-target }}/release/*.exe
            src-tauri/target/${{ matrix.tauri-target }}/release/*.app
